<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeoRubi-AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Bolitas decorativas del fondo -->
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <div class="blob blob4"></div>

  <div class="container">
    <!-- Título -->
    <header>
      <h1>
        <span class="bolt">⚡</span>
        NeoRubi-AI
        <span class="bolt">⚡</span>
      </h1>
      <p class="subtitle">Inteligencia Artificial estilo Cyberpunk</p>
    </header>

    <!-- Tarjeta -->
    <div class="card">
      <!-- Avatar -->
      <div class="avatar-area">
        <div class="avatar-box">
          <div class="girl">👩‍💻</div>
          <div class="flower">🌺</div>
        </div>
        <h2>Asistente Virtual</h2>
      </div>

      <!-- Chat -->
      <div id="chat" class="chat"></div>

      <!-- Input -->
      <div class="input-area">
        <input type="text" id="input" placeholder="Escribe tu pregunta..." />
        <div class="buttons">
          <button id="send">ENVIAR</button>
          <button id="voice">🎤</button>
          <button id="analyze">📊 ANALIZAR DATOS</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
